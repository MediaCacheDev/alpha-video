// The React Native package's Android module. It compiles the standalone library's sources
// (../../android) together with the React Native glue, because autolinking adds only this one
// Gradle project to the app.

def isNewArchitectureEnabled() {
    // Set by the app's gradle.properties, and always "true" from React Native 0.82
    return project.findProperty('newArchEnabled')?.toString() == 'true'
}

apply plugin: 'com.android.library'
if (isNewArchitectureEnabled()) {
    apply plugin: 'com.facebook.react'
}

def safeExtGet(name, fallback) {
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
}

def coreDir = file('../../android')
def packageRoot = file('../..')

// The codec modules built in, android/vpx (libvpx) and android/av1 (dav1d): the app's package.json
// "react-native-alpha-video": { "codecs": [...] }, else both. The podspec reads the same setting.
def readCodecs() {
    def allCodecs = ['vpx', 'av1']
    def appPackageJson = rootProject.file('../package.json')
    if (!appPackageJson.exists()) return allCodecs
    def config = new groovy.json.JsonSlurper().parse(appPackageJson)['react-native-alpha-video']
    if (config?.codecs == null) return allCodecs
    def unknown = config.codecs.findAll { !allCodecs.contains(it) }
    if (!(config.codecs instanceof List) || unknown) {
        throw new GradleException("react-native-alpha-video: \"codecs\" in ${appPackageJson} must list some of ${allCodecs}, not ${config.codecs}")
    }
    return allCodecs.findAll { config.codecs.contains(it) }
}
def codecs = readCodecs()
logger.lifecycle("react-native-alpha-video: codecs ${codecs.isEmpty() ? 'none (MediaCodec only)' : codecs.join(', ')}")

// range-source, the add-on the player reads URLs and data sources through, is the app's own
// dependency, react-native-range-source, which autolinking adds; the player finds it at run time
// (RangeSourceLink) and plays URLs without it.
def rangeSourceProject = rootProject.findProject(':react-native-range-source')
logger.lifecycle("react-native-alpha-video: range-source ${rangeSourceProject ? 'from react-native-range-source' : 'not installed (URLs are downloaded whole; npm i react-native-range-source for range streaming and storage)'}")

if (isNewArchitectureEnabled()) {
    // The codegen tasks look for package.json and the specs next to this folder; both are two
    // levels up, in the package root.
    tasks.named('generateCodegenSchemaFromJavaScript').configure {
        jsRootDir.set(file("${packageRoot}/react-native/src"))
        jsInputFiles.set(fileTree("${packageRoot}/react-native/src") { include '**/*.ts', '**/*.tsx' })
    }
    tasks.named('generateCodegenArtifactsFromSchema').configure {
        packageJsonFile.set(file("${packageRoot}/package.json"))
    }
}

android {
    namespace 'dev.mediacache.alphavideo.reactnative'
    compileSdk safeExtGet('compileSdkVersion', 36)
    ndkVersion safeExtGet('ndkVersion', '27.1.12297006')

    defaultConfig {
        minSdk safeExtGet('minSdkVersion', 24)
        buildConfigField 'boolean', 'IS_NEW_ARCHITECTURE_ENABLED', isNewArchitectureEnabled().toString()
        consumerProguardFiles("${coreDir}/consumer-rules.pro", *codecs.collect { "${coreDir}/${it}/consumer-rules.pro" })

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -frtti -fexceptions -O3'
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
                arguments '-DANDROID_STL=c++_shared', "-DALPHA_VIDEO_CODECS=${codecs.isEmpty() ? 'none' : codecs.join(';')}"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            java.srcDirs = [
                'src/main/java',
                "${coreDir}/src/main/java",
                isNewArchitectureEnabled() ? 'src/newarch/java' : 'src/oldarch/java',
                // AppDataSource, against range-source's classes, or a stub without them
                rangeSourceProject ? "${coreDir}/src/rangesource/java" : 'src/norangesource/java',
            ] + codecs.collect { "${coreDir}/${it}/src/main/java" }
        }
    }
}

dependencies {
    implementation 'com.facebook.react:react-android'
    if (rangeSourceProject) {
        compileOnly rangeSourceProject
    }
}

// Maven publication for dev.mediacache:alpha-video, and for alpha-video-media3, -vpx and -av1
// (their build.gradle sets publishArtifactId, publishDescription and publishLicenses, the bundled
// code's licences beside MIT, before applying this). Run it through scripts/publish-android.sh.
//
// Signing reads ORG_GRADLE_PROJECT_signingInMemoryKey (armored secret key), …KeyPassword and
// optionally …KeyId. Without a key the artifacts are left unsigned, which is enough for
// publishToMavenLocal.

apply plugin: 'maven-publish'
apply plugin: 'signing'

def repoUrl = 'https://github.com/MediaCacheDev/alpha-video'
def artifact = project.ext.has('publishArtifactId') ? project.ext.publishArtifactId : 'alpha-video'
def bundledLicenses = project.ext.has('publishLicenses') ? project.ext.publishLicenses : [
    [name: 'BSD-3-Clause (bundled libwebm parser)', url: 'https://chromium.googlesource.com/webm/libwebm/+/refs/heads/main/LICENSE.TXT'],
]

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                artifactId = artifact

                pom {
                    name = artifact
                    description = project.ext.has('publishDescription') ? project.ext.publishDescription : 'Transparent video for Android: VP9 or AV1 WebM with alpha on MediaCodec, or in software with alpha-video-vpx and alpha-video-av1, drawn into a TextureView.'
                    url = repoUrl
                    inceptionYear = '2026'
                    licenses {
                        license {
                            name = 'MIT'
                            url = 'https://opensource.org/licenses/MIT'
                            distribution = 'repo'
                        }
                        bundledLicenses.each { bundled ->
                            license {
                                name = bundled.name
                                url = bundled.url
                                distribution = 'repo'
                            }
                        }
                    }
                    developers {
                        developer {
                            id = 'danielkpl2'
                            name = 'Daniel Kasprowicz'
                            email = '9932671+danielkpl2@users.noreply.github.com'
                            url = 'https://github.com/danielkpl2'
                        }
                    }
                    scm {
                        connection = "scm:git:${repoUrl}.git"
                        developerConnection = "scm:git:${repoUrl}.git"
                        url = repoUrl
                    }
                }
            }
        }
        repositories {
            maven {
                name = 'staging'
                // Both artifacts, so that one bundle uploads them together
                url = rootProject.layout.buildDirectory.dir('staging-repo')
            }
        }
    }

    def signingKey = findProperty('signingInMemoryKey')
    if (signingKey) {
        signing {
            def keyId = findProperty('signingInMemoryKeyId')
            def password = findProperty('signingInMemoryKeyPassword')
            if (keyId) {
                useInMemoryPgpKeys(keyId, signingKey, password)
            } else {
                useInMemoryPgpKeys(signingKey, password)
            }
            sign publishing.publications.release
        }
    }
}

// Maven publication for dev.mediacache:alpha-video. Run it through scripts/publish-android.sh.
//
// Signing reads ORG_GRADLE_PROJECT_signingInMemoryKey (armored secret key), …KeyPassword and
// optionally …KeyId. Without a key the artifacts are left unsigned, which is enough for
// publishToMavenLocal.

apply plugin: 'maven-publish'
apply plugin: 'signing'

def repoUrl = 'https://github.com/MediaCacheDev/alpha-video'

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                artifactId = 'alpha-video'

                pom {
                    name = 'alpha-video'
                    description = 'Transparent video for Android: VP9 WebM with alpha in software (FFmpeg + libvpx), and dual-stream VP9 or AV1 on the hardware decoders, drawn into a TextureView.'
                    url = repoUrl
                    inceptionYear = '2026'
                    licenses {
                        license {
                            name = 'MIT'
                            url = 'https://opensource.org/licenses/MIT'
                            distribution = 'repo'
                        }
                        license {
                            name = 'GNU Lesser General Public License v2.1 or later (bundled FFmpeg)'
                            url = 'https://www.gnu.org/licenses/old-licenses/lgpl-2.1.txt'
                            distribution = 'repo'
                        }
                        license {
                            name = 'BSD-3-Clause (bundled libvpx)'
                            url = 'https://chromium.googlesource.com/webm/libvpx/+/refs/tags/v1.14.0/LICENSE'
                            distribution = 'repo'
                        }
                        license {
                            name = 'BSD-2-Clause (bundled dav1d)'
                            url = 'https://code.videolan.org/videolan/dav1d/-/blob/1.5.1/COPYING'
                            distribution = 'repo'
                        }
                    }
                    developers {
                        developer {
                            id = 'danielkpl2'
                            name = 'Daniel Kasprowicz'
                            email = '9932671+danielkpl2@users.noreply.github.com'
                            url = 'https://github.com/danielkpl2'
                        }
                    }
                    scm {
                        connection = "scm:git:${repoUrl}.git"
                        developerConnection = "scm:git:${repoUrl}.git"
                        url = repoUrl
                    }
                }
            }
        }
        repositories {
            maven {
                name = 'staging'
                url = layout.buildDirectory.dir('staging-repo')
            }
        }
    }

    def signingKey = findProperty('signingInMemoryKey')
    if (signingKey) {
        signing {
            def keyId = findProperty('signingInMemoryKeyId')
            def password = findProperty('signingInMemoryKeyPassword')
            if (keyId) {
                useInMemoryPgpKeys(keyId, signingKey, password)
            } else {
                useInMemoryPgpKeys(signingKey, password)
            }
            sign publishing.publications.release
        }
    }
}
